name: Bindr release checks
on:
  push:
    branches: [main, release/hackathon-live]
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      OCR_MODEL_DIR: ${{ github.workspace }}/.ocr-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-runtime.txt 'pytest>=8,<9'
      - name: Deployment script syntax
        run: |
          bash -n scripts/deploy-google-cloud.sh
          sh -n scripts/start.sh
      - name: Cache OCR weights
        uses: actions/cache@v4
        with:
          path: .ocr-models
          key: rapidocr-3.10-ppocrv4-mobile
      - name: Prepare OCR models
        run: python -c 'from backend.app.ai.document_processor import warm_ocr_models; warm_ocr_models()'
      - name: Backend and AI tests
        run: python -m pytest backend/app/tests backend/app/ai/tests -q
      - name: Integration regressions
        run: python scripts/run_integration_regressions.py --source . --auth-hook tests/regression/final_acceptance/signed_session.py --ocr-model-dir .ocr-models
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_URL: /api/v1
      - name: Real frontend adapter against FastAPI
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          cd frontend
          node checks/live-api.mjs http://127.0.0.1:8000
